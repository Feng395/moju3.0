<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSE 流式聊天 Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .config {
            padding: 15px 20px;
            background: #f7f7f7;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .config input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }
        
        .message {
            margin-bottom: 20px;
            display: flex;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .message.assistant .message-content {
            background: white;
            color: #333;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .message-content.streaming {
            position: relative;
        }
        
        .message-content.streaming::after {
            content: '▊';
            animation: blink 1s infinite;
            margin-left: 2px;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }
        
        .input-container {
            display: flex;
            gap: 10px;
        }
        
        .input-container input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .input-container input:focus {
            border-color: #667eea;
        }
        
        .input-container button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .input-container button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .input-container button:active {
            transform: translateY(0);
        }
        
        .input-container button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            padding: 8px 16px;
            background: #f0f0f0;
            border-radius: 16px;
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .status.connecting {
            background: #fff3cd;
            color: #856404;
        }
        
        .status.connected {
            background: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 SSE 流式聊天 Demo</h1>
            <p>模具数据审核助手</p>
        </div>
        
        <div class="config">
            <input type="text" id="jobId" placeholder="输入任务 ID (Job ID)" value="4cc3825b-5868-4b04-b525-ee3a14b98a6d">
            <input type="text" id="token" placeholder="输入 JWT Token (可选，测试环境会自动生成)">
        </div>
        
        <div id="status" class="status" style="display: none;"></div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message assistant">
                <div class="message-content">
                    你好！我是模具数据审核助手。<br>
                    请先启动审核（调用 /start 接口），然后就可以和我聊天了。<br><br>
                    你可以说：<br>
                    • "将 UP01 的材质改为 718"<br>
                    • "帮我检查一下数据"<br>
                    • "修改下模板的重量为 7.5kg"
                </div>
            </div>
        </div>
        
        <div class="input-area">
            <div class="input-container">
                <input type="text" id="messageInput" placeholder="输入消息..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()" id="sendButton">发送</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8211';
        let history = [];
        let isStreaming = false;
        
        // 显示状态
        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
            statusEl.style.display = 'block';
            
            if (type !== 'error') {
                setTimeout(() => {
                    statusEl.style.display = 'none';
                }, 3000);
            }
        }
        
        // 添加消息到聊天窗口
        function addMessage(role, content, streaming = false) {
            const messagesEl = document.getElementById('chatMessages');
            const messageEl = document.createElement('div');
            messageEl.className = `message ${role}`;
            
            const contentEl = document.createElement('div');
            contentEl.className = `message-content ${streaming ? 'streaming' : ''}`;
            contentEl.textContent = content;
            
            messageEl.appendChild(contentEl);
            messagesEl.appendChild(messageEl);
            
            // 滚动到底部
            messagesEl.scrollTop = messagesEl.scrollHeight;
            
            return contentEl;
        }
        
        // 更新消息内容
        function updateMessage(element, content, streaming = false) {
            element.textContent = content;
            element.className = `message-content ${streaming ? 'streaming' : ''}`;
            
            // 滚动到底部
            const messagesEl = document.getElementById('chatMessages');
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
        
        // 发送消息
        async function sendMessage() {
            if (isStreaming) {
                showStatus('正在处理中，请稍候...', 'connecting');
                return;
            }
            
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();
            
            if (!message) {
                return;
            }
            
            const jobId = document.getElementById('jobId').value.trim();
            if (!jobId) {
                showStatus('请输入任务 ID', 'error');
                return;
            }
            
            // 清空输入框
            messageInput.value = '';
            
            // 添加用户消息
            addMessage('user', message);
            history.push({ role: 'user', content: message });
            
            // 禁用发送按钮
            const sendButton = document.getElementById('sendButton');
            sendButton.disabled = true;
            isStreaming = true;
            
            showStatus('正在思考...', 'connecting');
            
            try {
                // 获取 Token
                let token = document.getElementById('token').value.trim();
                if (!token) {
                    // 测试环境：生成临时 Token
                    token = 'test-token-placeholder';
                }
                
                // 创建 SSE 连接
                const response = await fetch(`${API_BASE_URL}/api/v1/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        job_id: jobId,
                        message: message,
                        history: history.slice(-10),  // 只发送最近10条
                        stream: true
                    })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail?.message || '请求失败');
                }
                
                showStatus('正在接收回复...', 'connected');
                
                // 创建 AI 消息元素
                const aiMessageEl = addMessage('assistant', '', true);
                let fullResponse = '';
                
                // 读取 SSE 流
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                while (true) {
                    const { done, value } = await reader.read();
                    
                    if (done) {
                        break;
                    }
                    
                    // 解码数据
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (!line || line.startsWith(':')) {
                            continue;
                        }
                        
                        // 移除 "data: " 前缀
                        let data = line;
                        if (data.startsWith('data: ')) {
                            data = data.substring(6);
                        }
                        
                        try {
                            const json = JSON.parse(data);
                            
                            if (json.type === 'content') {
                                fullResponse += json.delta;
                                updateMessage(aiMessageEl, fullResponse, true);
                            } else if (json.type === 'done') {
                                updateMessage(aiMessageEl, fullResponse, false);
                                showStatus('回复完成', 'connected');
                            } else if (json.type === 'error') {
                                throw new Error(json.message);
                            }
                        } catch (e) {
                            // 忽略 JSON 解析错误
                        }
                    }
                }
                
                // 保存到历史
                history.push({ role: 'assistant', content: fullResponse });
                
            } catch (error) {
                console.error('Error:', error);
                showStatus(`错误: ${error.message}`, 'error');
                addMessage('assistant', `抱歉，发生错误：${error.message}`);
            } finally {
                // 启用发送按钮
                sendButton.disabled = false;
                isStreaming = false;
            }
        }
        
        // 处理回车键
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
        
        // 页面加载完成
        window.onload = function() {
            document.getElementById('messageInput').focus();
        };
    </script>
</body>
</html>
