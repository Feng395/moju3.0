# ============================================
# 本地测试环境 Docker Compose 配置
# 用于本地开发和接口测试
# ============================================

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    container_name: mold_cost_postgres
    environment:
      POSTGRES_DB: mold_cost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 首次初始化时只加载基础建表脚本，避免 add.sql 在全新库上重复建表
      - ./sql/00_init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mold_cost_network
    restart: unless-stopped

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: mold_cost_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mold_cost_network
    restart: unless-stopped

  # RabbitMQ消息队列
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: mold_cost_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP端口
      - "15672:15672" # 管理界面
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - mold_cost_network
    restart: unless-stopped

  # MinIO对象存储
  minio:
    image: minio/minio:latest
    container_name: mold_cost_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API端口
      - "9001:9001"   # 控制台
    volumes:
      - minio_data:/data
    networks:
      - mold_cost_network
    restart: unless-stopped

  # MinIO初始化（创建bucket）- 一次性任务，执行完自动退出
  minio-init:
    image: minio/mc:latest
    container_name: mold_cost_minio_init
    restart: "no"
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://minio:9000 minioadmin minioadmin; do
        echo 'Waiting for MinIO to become ready...';
        sleep 2;
      done;
      mc mb myminio/mold-cost --ignore-existing;
      mc anonymous set download myminio/mold-cost;
      echo 'MinIO bucket created successfully';
      "
    networks:
      - mold_cost_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local

networks:
  mold_cost_network:
    driver: bridge
    name: mold_cost_network
