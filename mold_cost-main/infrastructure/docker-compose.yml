version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:14
    container_name: mold-cost-postgres
    environment:
      POSTGRES_USER: mold_user
      POSTGRES_PASSWORD: mold_password
      POSTGRES_DB: mold_cost_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - mold-cost-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: mold-cost-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mold-cost-network

  # RabbitMQ消息队列
  rabbitmq:
    image: rabbitmq:3-management
    container_name: mold-cost-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"  # 管理界面
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - mold-cost-network

  # MinIO对象存储
  minio:
    image: minio/minio:latest
    container_name: mold-cost-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - mold-cost-network

  # API Gateway
  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    container_name: mold-cost-api-gateway
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://mold_user:mold_password@postgres:5432/mold_cost_db
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - minio
    networks:
      - mold-cost-network

  # MCP Services
  cad-parser-mcp:
    build:
      context: ../mcp-services/cad-parser-mcp
      dockerfile: Dockerfile
    container_name: mold-cost-cad-parser
    ports:
      - "8101:8101"
    networks:
      - mold-cost-network

  pricing-server-mcp:
    build:
      context: ../mcp-services/pricing-server-mcp
      dockerfile: Dockerfile
    container_name: mold-cost-pricing-server
    ports:
      - "8105:8105"
    environment:
      DATABASE_URL: postgresql+asyncpg://mold_user:mold_password@postgres:5432/mold_cost_db
    depends_on:
      - postgres
    networks:
      - mold-cost-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:

networks:
  mold-cost-network:
    driver: bridge
